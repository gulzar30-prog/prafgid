# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: prafgid_db
    environment:
      POSTGRES_USER: prafgid
      POSTGRES_PASSWORD: prafgid123
      POSTGRES_DB: prafgid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prafgid_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: